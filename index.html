<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Polymarket market-state dashboard</title>
    </head>
    <body>
        <header class="dashboard-toolbar">
            <form class="dashboard-add-form" id="add-event-form">
                <label for="event-slug">Add event by slug</label>
                <div class="dashboard-add-row">
                    <input
                        id="event-slug"
                        name="slug"
                        type="text"
                        placeholder="btc-updown-5m-1789556100"
                        autocomplete="off"
                        required
                    />
                    <button type="submit">Add event</button>
                </div>
                <span class="dashboard-add-status" id="add-event-status" aria-live="polite"></span>
            </form>

            <div class="dashboard-meta">
                <div class="recorder-status" id="recorder-status" data-state="connecting">
                    <span class="recorder-status-dot" aria-hidden="true"></span>
                    <span id="recorder-status-text">recorder…</span>
                </div>

                <section class="volume-legend" aria-label="Global signed force color scale">
                    <div class="volume-legend-header">
                        <span>signed force</span>
                        <span class="volume-legend-scale" id="volume-legend-scale"></span>
                    </div>
                    <div class="volume-legend-bar" id="volume-legend-bar"></div>
                    <div class="volume-legend-ticks" id="volume-legend-ticks"></div>
                </section>
            </div>
        </header>
        <div class="grid" id="grid"></div>
        <script type="module" src="/src/main.ts"></script>
    </body>
</html>
