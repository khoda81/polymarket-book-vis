name: Format token pressure

on:
  push:

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.1.0
      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Format and dump
        run: |
          files="backend/recorderStore.ts backend/recorderStore.test.ts src/chart/seriesTimelineView.ts src/lib/pressureBookAdapter.test.ts src/lib/pressureBookAdapter.ts src/lib/pressureFrontierMemory.ts src/lib/pressureFrontierSnapshot.ts"
          bunx prettier --write $files
          for f in $files; do
            echo "FILE_BEGIN:$f"
            base64 -w0 "$f"
            echo
            echo "FILE_END:$f"
          done
