name: Release

# Every push to main is released and deployed.
on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.name.outputs.tag }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6.1.0

      # Derived from the commit rather than the clock, so a re-run reuses the tag.
      - name: Name the release
        id: name
        env:
          COMMITTED_AT: ${{ github.event.head_commit.timestamp }}
        run: echo "tag=v$(date -u -d "$COMMITTED_AT" +%Y.%m.%d)-${GITHUB_SHA::7}" >>"$GITHUB_OUTPUT"

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run tests
        run: bun test

      - name: Typecheck and build
        run: bun run build

      - name: Package
        env:
          ASSET: polymarket-book-vis-${{ steps.name.outputs.tag }}-dist.tar.gz
        run: |
          tar -czf "$ASSET" -C dist .
          sha256sum "$ASSET" > "$ASSET.sha256"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.name.outputs.tag }}
          ASSET: polymarket-book-vis-${{ steps.name.outputs.tag }}-dist.tar.gz
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$ASSET" "$ASSET.sha256" --clobber
          else
            gh release create "$TAG" "$ASSET" "$ASSET.sha256" --target "$GITHUB_SHA" --generate-notes
          fi

  # Server setup lives in polymarket-book-recorder/deploy.
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: deploy-frontend
      cancel-in-progress: false
    steps:
      - name: Deploy over SSH
        env:
          TAG: ${{ needs.build.outputs.tag }}
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_KNOWN_HOSTS: ${{ vars.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          if [ -z "$DEPLOY_HOST" ]; then
            echo "::notice::DEPLOY_HOST is not configured; release published without deploying."
            exit 0
          fi
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519
          # TAG is meant to expand here, on the runner.
          # shellcheck disable=SC2029
          ssh "polyviz-deploy@$DEPLOY_HOST" frontend "$TAG"
